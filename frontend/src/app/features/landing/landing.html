<app-section>
  <!-- Frosted Glass Card -->
  <app-card>
    <img
      src="me_ai.png"
      alt="Profile"
      class="w-30 h-30 mx-auto rounded-full border-2 border-white/50 shadow-md mb-6"
    />

    <h1 class="text-4xl font-bold mb-3 drop-shadow-lg">
      Hi, I’m Kenneth 👋
    </h1>

    <p class="text-lg mb-8 opacity-90">
      Passionate IT Engineer crafting clean and modern full-stack solutions with Java, Angular, and more.
    </p>

    <button
      (click)="onCTA()"
      class="px-6 py-3 bg-blue-500 hover:bg-blue-600 transition rounded-full text-white font-medium shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
    >
      View My Work 🚀
    </button>
</app-card>

  <!-- Optional floating decoration -->
  <div class="absolute bottom-6 text-white opacity-60 text-sm">
    © 2025 Kenneth Cerrado — IT Engineer
  </div>
</app-section>
