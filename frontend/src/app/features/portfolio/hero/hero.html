<app-section [bgStyle]="{backgroundColor: 'var(--portfolio-bg)'}" bgClass="relative min-h-screen flex flex-col bg-cover bg-center bg-no-repeat pt-20" id="home">
    
    <div class="flex justify-center align-center w-full overflow-hidden mt-10 ps-10">
         <h1 class="md:text-2xl text-lg typing-text font-bold whitespace-nowrap w-0 overflow-hidden">
            Code. Learn. Create. Repeat.
        </h1> 
    </div>

    <div class="flex flex-col flex-1 items-center justify-center">
        <app-card class="text-center md:text-center space-y-6">
            <h2 class="text-2xl font-bold text-[color:var(--portfolio-heading)]">
                Projects & Experiments 💻
            </h2>
            <p class="text-[color:var(--portfolio-text)] text-base leading-relaxed">
                Here are some of the projects I’ve worked on — from building simple web apps 
                to experimenting with Java, Spring Boot, and modern frontend frameworks.  
                Each one taught me something new about clean code, performance, and design.
            </p>
            <div class="flex flex-wrap justify-center mt-4 gap-3">
                <button
                    class="px-5 py-2 rounded-full bg-gradient-to-r from-blue-500 to-blue-700 text-white 
                            hover:scale-105 transition-all shadow-md"
                    >
                    View My Projects 🚀
                </button>

                <button
                    class="px-5 py-2 rounded-full border border-blue-500 text-blue-500 
                            hover:bg-blue-500 hover:text-white transition-all"
                    >
                    My Learning Journey 📘
                </button>
            </div>
        </app-card>
    </div>
</app-section>
